-Server && python3 -c \"\nimport json, re\nrecipes = json.load(open('tmp/fd_parse/recipes_raw.json'))\nraw = json.dumps(recipes, ensure_ascii=False)\n# 找未翻译残留:形如 minecraft:xxx / c:xxx / farmersdelight:xxx 但没跟中文括号的\n# 直接扫描源 json 更可靠\nimport glob\nids=set(); tags=set()\nfor f in glob.glob('/tmp/fd_recipe/data/farmersdelight/recipe/**/*.json', recursive=True):\n    d=json.load(open(f))\n    def walk(o):\n        if isinstance(o,dict):\n            if 'item' in o and isinstance(o['item'],str): ids.add(o['item'])\n            if 'tag' in o and isinstance(o['tag'],str): tags.add(o['tag'])\n            for v in o.values(): walk(v)\n        elif isinstance(o,list):\n            for v in o: walk(v)\n    walk(d)\n# 加载映射\nlang=json.load(open('/tmp/fd_recipe/assets/farmersdelight/lang/zh_cn.json'))\nfd={k.split('.',1)[1].replace('.',':') for k in lang if k.startswith(('item.farmersdelight.','block.farmersdelight.'))}\nvan={'apple','wheat','sugar','egg','milk_bucket','carrot','potato','beetroot','beetroot_soup','mushroom_stew','brown_mushroom','red_mushroom','chicken','cooked_chicken','beef','cooked_beef','porkchop','cooked_porkchop','mutton','cooked_mutton','cod','cooked_cod','salmon','cooked_salmon','rabbit','cooked_rabbit','rabbit_stew','bread','cake','pumpkin_pie','cookie','bowl','stick','paper','string','leather','bone','flint','clay_ball','clay','gravel','sand','ink_sac','kelp','dried_kelp','sweet_berries','glow_berries','honey_bottle','honeycomb','glass_bottle','snowball','bone_meal','wheat_seeds','beetroot_seeds','pumpkin_seeds','melon_seeds','torch','lantern','water_bucket','nether_wart','blaze_rod','magma_cream','golden_carrot','golden_apple','emerald','diamond','iron_ingot','gold_ingot','copper_ingot','stone','cobblestone','oak_log','spruce_log','birch_log','jungle_log','acacia_log','dark_oak_log','mangrove_log','cherry_log','crimson_stem','warped_stem','oak_wood','spruce_wood','birch_wood','jungle_wood','acacia_wood','dark_oak_wood','mangrove_wood','cherry_wood','cri