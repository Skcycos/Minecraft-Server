#Master switch for the stock market mod
enabled = true
#Starting cash for every new player account
# Default: 1000.0
# Range: 0.0 ~ 1.0E9
initialCash = 1000.0
#Trading fee rate (fraction of the order value), e.g. 0.001 = 0.1%
# Default: 0.001
# Range: 0.0 ~ 0.1
feeRate = 0.001
#How often (in server ticks) the whole market updates its prices, e.g. 200 = every 10 seconds
# Default: 200
# Range: 1 ~ 1200
tickInterval = 100
#Maximum quantity allowed per order
# Default: 9999
# Range: 1 ~ 1000000
maxOrderQty = 9999
#Length of one market day/cycle in server ticks; default 24000 matches one Minecraft day
# Default: 24000
# Range: 1200 ~ 2400000
marketCycleTicks = 24000
#Probability of generating one company news event at each market-cycle boundary
# Default: 0.25
# Range: 0.0 ~ 1.0
newsEventProbability = 0.25
#Probability of a dividend event at each market-cycle boundary
# Default: 0.04
# Range: 0.0 ~ 1.0
dividendProbability = 0.04
#Probability of a 2-for-1 stock split at each market-cycle boundary
# Default: 0.01
# Range: 0.0 ~ 1.0
splitProbability = 0.01
#Probability of a temporary trading halt at each market-cycle boundary
# Default: 0.015
# Range: 0.0 ~ 1.0
haltProbability = 0.015
#Number of market cycles a temporary halt lasts
# Default: 1
# Range: 1 ~ 30
haltDurationCycles = 1
#Dividend cash paid per share during a dividend event
# Default: 0.05
# Range: 0.0 ~ 1000000.0
dividendPerShare = 0.05
#Base value for the equal-weight market index
# Default: 1000.0
# Range: 1.0 ~ 1.0E9
indexBaseValue = 1000.0
#Base absolute news price impact; earnings events may use up to 1.8x this value
#but all impacts still respect the configured hard price boundaries
# Default: 0.08
# Range: 0.0 ~ 1.0
newsImpactMax = 0.08
#Bank bridge id registered into StockMarketApi by the economy Mod (Server Menu).
#Empty/unknown id means the bank bridge is unavailable.
bankBridgeId = "server_menu:lc_bank_main"
#Maximum single bank→securities deposit amount in LC copper coins.
#1 copper = 1 securities display unit (internal +100 cents per copper).
# Default: 10000000
# Range: 1 ~ 9000000000000000
maxBankDepositCopper = 10000000
#Maximum single securities→bank withdrawal request in internal cents
#(display amount x 100). Rounded up to whole copper before debit.
# Default: 1000000000
# Range: 1 ~ 9000000000000000000
maxBankWithdrawCents = 1000000000
#Minimum server ticks between two bank transfers by the same player (e.g. 20 = 1 second).
# Default: 20
# Range: 0 ~ 1200
bankTransferCooldownTicks = 20
#Hard lower price boundary as a multiple of the split-adjusted reference price.
#The model never lets a stock fall below this value.
# Default: 0.35
# Range: 0.01 ~ 1.0
priceFloorMultiplier = 0.35
#Hard upper price boundary as a multiple of the split-adjusted reference price.
#The model never lets a stock rise above this value.
# Default: 3.0
# Range: 1.0 ~ 100.0
priceCeilingMultiplier = 3.0
#Fraction of the logarithmic gap back to the reference price applied on each update.
#0 disables mean reversion; 0.0015 keeps high volatility while preventing permanent drift.
# Default: 0.0015
# Range: 0.0 ~ 1.0
meanReversionStrength = 0.0015
