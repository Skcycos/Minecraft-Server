#可购买的彩票面额（铜币）。每个值必须是正整数，且所有奖项倍率都能整除。
ticketTiers = ["20", "50", "100", "500", "1000"]
#奖项表：每项为 权重:奖金倍率基点。10000 基点 = 1 倍；所有权重总和必须为 10000。
prizeTable = ["6001:0", "2000:5000", "1000:10000", "600:20000", "300:50000", "80:100000", "18:500000", "1:1000000"]
#未刮开彩票的有效期；到期后将向原购买者退回票价。
# Default: 7
# Range: 1 ~ 365
expiryDays = 7
#到期/清理任务的最小执行间隔（tick）。使用到期优先队列，不会全表扫描。
# Default: 1200
# Range: 20 ~ 72000
sweepIntervalTicks = 1200
#每次到期任务最多处理的彩票记录数。
# Default: 64
# Range: 1 ~ 4096
sweepBatchSize = 64
#已兑奖或已退款票据保留的小时数，用于重试和防重放；过期后仅保留为无效票据。
# Default: 24
# Range: 1 ~ 720
resolvedRetentionHours = 24
#账本可保存的最大彩票记录数；达到上限时暂停售票，避免多人服务器存档无界增长。
# Default: 50000
# Range: 128 ~ 1000000
maxSavedTickets = 50000
#单次购票最多签发的张数；每张均有独立票据 UUID 与独立开奖结果。
# Default: 20
# Range: 1 ~ 64
maxPurchaseQuantity = 20
