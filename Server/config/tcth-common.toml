#Master switch for the TCTH integration framework.
#When false, the dish-cooked event dispatcher posts no events
#and compat modules must not perform business logic.
enabled = true
#Send tcth:on_dish_cooked dish actions (Jobs+ rewards).
#Does NOT gate the separate arc:on_eat taste_meal action:
#with the tcth-chef data pack enabled, eating #tcth:chef_meals
#grants 1 XP even when this is false.
#Default off. Only enable after on-server verification of the
#seven player take-out scenarios (workbench, furnace, smoker,
#FD cooking pot, KC pot, KC stockpot, KC steamer).
jobsPlusRewardsEnabled = true
#Maximum dish actions sent per player per tick (rate limit).
# Default: 20
# Range: 1 ~ 1000
maxEventsPerTickPerPlayer = 20
#Enable the per-player cooking statistics archive.
#Independent of jobsPlusRewardsEnabled and of Jobs+/Arc.
cookingStatsEnabled = true
#Unlock Field Guide entries when a dish is cooked (take-out).
#Only controls the TCTH dish-cooked unlock; does not control the
#Field Guide mod itself, cooking stats, or Jobs+/Arc rewards.
#Default true. No effect when Field Guide is not installed.
fieldGuideCookbookEnabled = true
#Sign finished dishes with the chef's tcth:cooking_signature component.
#Only controls signing of NEWLY produced dishes; does not remove
#existing signatures, and does not affect cooking stats, Field Guide,
#or Jobs+/Arc. Default true.
dishSignaturesEnabled = true
#Master switch for the chef ability tree (knife / hearth / tasting / study routes).
#When false, all four routes stop applying their effects.
#Does not delete purchased powerups and does not affect Jobs+ GUI.
#Default true.
chefAbilitiesEnabled = true
#Tasting route: grant short status effects after eating #tcth:chef_meals.
#Default true.
tastingEffectsEnabled = true
#Hearth route: reduce fire damage (#minecraft:is_fire) by 15/30/50%.
#Default true.
fireResistanceAbilitiesEnabled = true
#Knife route: chance to skip durability loss on #c:tools/knife items.
#Default true.
knifeDurabilityAbilitiesEnabled = true
#Tasting route anti-farm cooldown in ticks (default 400 = 20 s).
#Per-player, in-memory only, shared by all tasting nodes.
#Default: 400. Range: 1 ~ 72000.
# Default: 400
# Range: 1 ~ 72000
tastingEffectCooldownTicks = 400
#Unified crop-harvest event detection and posting (CropHarvestedEvent).
#When false, no farming events are detected or posted.
#Independent of farmerRewardsEnabled and of the cooking framework.
#Default true.
farmerIntegrationEnabled = true
#Send tcth:on_crop_harvested Arc actions (farmer job rewards).
#Only controls the Jobs+/Arc farmer reward settlement; does not
#gate farming event detection (farmerIntegrationEnabled).
#Independent of jobsPlusRewardsEnabled (chef dish rewards).
#Default off. Enable only after live player verification.
farmerRewardsEnabled = true
#Gunner profession master switch (Scorched Guns firearm kills).
#When false, no firearm-kill events are detected or posted.
#Independent of chef/farmer and of Jobs+/Arc.
#Default true.
gunnerIntegrationEnabled = true
#Send tcth:on_gun_kill Arc actions (gunner job rewards).
#Only controls the Jobs+/Arc gunner reward settlement; does not
#gate firearm-kill detection (gunnerIntegrationEnabled) or stats
#(gunnerStatsEnabled). Independent of jobsPlusRewardsEnabled
#(chef) and farmerRewardsEnabled.
#Default off. Enable only after live player verification.
gunnerRewardsEnabled = true
#Update per-player gunner statistics (tcth_gunner_stats.dat).
#Independent of gunnerRewardsEnabled. Default true.
gunnerStatsEnabled = true
#Maximum gun-kill actions sent per player per tick (rate limit).
# Default: 10
# Range: 1 ~ 1000
maxGunKillActionsPerTick = 10
#BOSS-tier gun-kill cooldown per player in ticks (default 1200 = 60 s).
#Per-player, in-memory only, prevents boss-respawn farming.
#Default: 1200. Range: 0 ~ 72000.
# Default: 1200
# Range: 0 ~ 72000
gunnerBossCooldownTicks = 1200
#Master switch for the tcth:gunner ability tree (4 routes).
#When false, no gunner ability takes effect.
#Default: true.
gunnerAbilitiesEnabled = true
#Marksmanship route: SG firearm damage dealt to non-player targets
#×1.05 / ×1.10 / ×1.15. Requires gunnerAbilitiesEnabled.
#Default: true.
gunDamageAbilitiesEnabled = true
#Ammo-saver route: chance not to consume ammo on a successful shot
#5% / 10% / 15%. Requires gunnerAbilitiesEnabled.
#Default: true.
gunAmmoAbilitiesEnabled = true
#Battlefield-defense route: SG firearm damage taken by the player
#×0.90 / ×0.80 / ×0.70. Requires gunnerAbilitiesEnabled.
#Default: true.
gunDefenseAbilitiesEnabled = true
#Gunner-study route: tcth:gunner job experience
#×1.15 / ×1.35 / ×1.60. Requires gunnerAbilitiesEnabled.
#Default: true.
gunExperienceAbilitiesEnabled = true
#Chat the player when a gunner battlefield medal unlocks.
#Medals still unlock and persist when this is false.
#Historical / migrated medals are never announced.
#Default: true.
gunnerMedalAnnouncementsEnabled = true
#Brewer (Mystic Brewer) beverage integration switch.
#Default off. When false, no BeveragePreparedEvent is posted
#and brewing compat modules must not perform detection logic.
brewerIntegrationEnabled = true
#Brewer (Mystic Brewer) experience rewards switch.
#Default off. When false, no tcth:on_beverage_prepared Arc
#action is sent and no brewer rewards settle. Requires
#enabled + brewerIntegrationEnabled as well. No gold.
brewerRewardsEnabled = true
#Maximum brewer reward actions settled per player per tick.
#Default 20. Protects against event storms; excess events are
#dropped (they never occupy idempotency or rate-limit state).
# Default: 20
# Range: 1 ~ 1000
maxBrewerRewardsPerTickPerPlayer = 20
#Master switch for the brewer ability tree (brewing / tasting /
#resistance / study routes). When false, all four routes stop
#applying their effects. Does not delete purchased powerups and
#does not affect the Jobs+ GUI or brewer rewards.
brewerAbilitiesEnabled = true
#Brewing route: beverage preparation grants short status effects
#I: Speed I 5s; II: Speed I 8s + Luck I 8s; III: Speed I 12s + Luck I 12s.
#Higher tier overwrites, never stacks. Requires brewerAbilitiesEnabled.
brewerBrewingAbilitiesEnabled = true
#Tasting route: drinking #tcth:brewer_drinks grants status effects
#I: Regeneration I 5s; II: Regeneration I 5s + Resistance I 8s;
#III: Regeneration I 5s + Resistance I 8s + Speed I 15s. Shared 20s
#cooldown. Requires brewerAbilitiesEnabled.
brewerTastingAbilitiesEnabled = true
#Resistance route: magical / indirect-magical / wither damage taken
#is reduced by 10% / 20% / 35%. Never full immunity; fire, fall,
#melee and projectile damage are unaffected.
#Requires brewerAbilitiesEnabled.
brewerResistanceAbilitiesEnabled = true
#Study route: tcth:brewer job experience multiplier
#1.15 / 1.35 / 1.60. Only the highest active tier applies,
#never stacked. Requires brewerAbilitiesEnabled.
brewerStudyAbilitiesEnabled = true
#Tasting-route shared anti-farm cooldown in ticks (default 400 = 20 s).
#Per-player, in-memory only, shared by all three tasting nodes.
#Range 1 ~ 72000.
# Default: 400
# Range: 1 ~ 72000
brewerDrinkCooldownTicks = 400
#Enable the per-player brewing statistics archive.
#Independent of brewerRewardsEnabled and of Jobs+/Arc.
#Default true.
brewerStatsEnabled = true
#Unlock Field Guide brewer beverage entries when a beverage
#is prepared (real player, non-automated).
#Independent of the chef cookbook and of Jobs+/Arc.
#Default true. No effect when Field Guide is not installed.
fieldGuideBrewerEnabled = true
#Master switch for TCTH Field Guide unlocks (chef cookbook +
#brewer catalogue). When false, no dish or beverage unlock is
#sent to Field Guide. Default true. No effect when Field Guide
#is not installed.
fieldGuideEnabled = true
#Master switch for the farmer ability tree (4 routes).
#When false, no farmer ability takes effect.
#Does not delete purchased powerups and does not affect the Jobs+ GUI.
#Default: true.
farmerAbilitiesEnabled = true
#Tilling route: chance to skip durability loss on #minecraft:hoes
#tools 10% / 20% / 35%. Requires farmerAbilitiesEnabled.
#Never repairs, copies or affects non-hoe items.
#Default: true.
tillingDurabilityAbilitiesEnabled = true
#Harvest route: real CropHarvestedEvent grants short effects
#I: Haste I 5s; II: Haste I + Speed I 8s; III: Haste I + Speed I 12s.
#Higher tier overwrites, never stacks; automated/fake/immature
#harvests never trigger; shared 10s cooldown, success-driven.
#Requires farmerAbilitiesEnabled.
#Default: true.
farmerHarvestAbilitiesEnabled = true
#Livestock route: breeding/taming/shearing grants short effects
#I: Regeneration I 5s; II: + Resistance I 8s; III: + Speed I 15s.
#Shared 20s cooldown; failed ops, non-player actors and
#mechanical paths never trigger.
#Requires farmerAbilitiesEnabled.
#Default: true.
farmerLivestockAbilitiesEnabled = true
#Farmer-study route: tcth:farmer job experience
#×1.15 / ×1.35 / ×1.60. Requires farmerAbilitiesEnabled.
#Default: true.
farmerStudyAbilitiesEnabled = true
#Harvest-route shared anti-farm cooldown in ticks (default 200 = 10 s).
#Per-player, in-memory only, shared by all three harvest nodes.
#Range 1 ~ 72000.
# Default: 200
# Range: 1 ~ 72000
farmerHarvestCooldownTicks = 200
#Livestock-route shared anti-farm cooldown in ticks (default 400 = 20 s).
#Per-player, in-memory only, shared by all three livestock nodes.
#Range 1 ~ 72000.
# Default: 400
# Range: 1 ~ 72000
farmerLivestockCooldownTicks = 400
#Master switch for the shadow thief framework.
#Default off. When false, no attempt is ever coordinated
#and no ShadowTheftEvent is posted. Even with this and
#shadowPlayerTheftEnabled on, REAL asset transfers stay
#locked behind shadowRealAssetTransfersEnabled (default
#off); the audit log is a plain SavedData, not an fsync
#WAL — live enablement needs operator confirmation.
shadowThiefIntegrationEnabled = true
#Allow shadow theft attempts against player targets.
#Default off. When false, player-target attempts are
#rejected at context validation. Real transfers still
#require shadowRealAssetTransfersEnabled.
shadowPlayerTheftEnabled = true
#Allow shadow theft attempts against entity targets.
#Default off. When false, entity-target attempts are
#rejected at context validation.
shadowEntityTheftEnabled = true
#Write shadow theft attempts to tcth_shadow_audit.dat.
#Default true. SUCCESS is only posted after a successful
#audit write; disabling audit therefore blocks SUCCESS
#outcomes (fail closed).
shadowAuditEnabled = true
#Master gate for REAL shadow theft asset transfers.
#Default off. Even with the framework and player switches
#on, no item/health/hunger/effect may move until this is
#explicitly enabled by an operator. Fail-closed on config
#read errors. Live-server enablement needs operator
#confirmation (the audit log is not an fsync WAL).
shadowRealAssetTransfersEnabled = true
#Base success chance of a shadow theft attempt (default 0.35).
#Final balance is decided in a later phase; the value is
#clamped into [shadowMinSuccessChance, shadowMaxSuccessChance].
#Range: 0.0 ~ 1.0.
# Default: 0.35
# Range: 0.0 ~ 1.0
shadowBaseSuccessChance = 0.35
#Lower clamp of the shadow theft success chance (default 0.05).
#A non-finite chance calculation fails closed to this value.
#Range: 0.0 ~ 1.0.
# Default: 0.05
# Range: 0.0 ~ 1.0
shadowMinSuccessChance = 0.05
#Upper clamp of the shadow theft success chance (default 0.85).
#A success chance never reaches 100%.
#Range: 0.0 ~ 1.0.
# Default: 0.85
# Range: 0.0 ~ 1.0
shadowMaxSuccessChance = 0.85
#Per-victim daily cap on successful ITEM thefts (default 3).
#Keyed by victim UUID + UTC date; at the cap the ITEM
#type is removed from the victim's candidates.
#Range: 1 ~ 10000.
# Default: 3
# Range: 1 ~ 10000
shadowDailyItemLossLimit = 3
#Per-thief global action cooldown after a successful theft,
#in ticks (default 200 = 10 s). In-memory, tick-based only.
#Range: 0 ~ 1728000.
# Default: 200
# Range: 0 ~ 1728000
shadowGlobalCooldownTicks = 200
#Short per-thief cooldown after an empty-candidate attempt,
#in ticks (default 40 = 2 s). In-memory, tick-based only.
#Range: 0 ~ 1728000.
# Default: 40
# Range: 0 ~ 1728000
shadowNoCandidateCooldownTicks = 40
#Per-thief cooldown after a failed roll or a failed transfer,
#in ticks (default 400 = 20 s). In-memory, tick-based only.
#Range: 0 ~ 1728000.
# Default: 400
# Range: 0 ~ 1728000
shadowFailureCooldownTicks = 400
#Per-victim grace period after a successful theft, in ticks
#(default 1200 = 60 s). In-memory, tick-based only.
#Range: 0 ~ 1728000.
# Default: 1200
# Range: 0 ~ 1728000
shadowVictimProtectionTicks = 1200
#Per-target alert window after a failed attempt (exposure),
#in ticks (default 100 = 5 s). While active the target is
#considered alerted (-0.20 success chance).
#In-memory, tick-based only. Range: 0 ~ 1728000.
# Default: 100
# Range: 0 ~ 1728000
shadowAlertTicks = 100
#New-player protection: a player target whose verified
#play time (Stats.PLAY_TIME, server ticks) is below this
#value is protected from shadow theft.
#Default 72000 = 1 hour. Range: 0 ~ 1728000.
# Default: 72000
# Range: 0 ~ 1728000
shadowNewPlayerProtectionTicks = 72000
#Master switch for shadow thief job-experience rewards.
#Default off. Even with the framework switches on, no
#tcth:on_shadow_theft_success Arc action is sent and no
#tcth:shadow_thief job experience is granted until an
#operator explicitly enables this. Fail-closed on config
#read errors.
shadowRewardsEnabled = false
#Master switch of the tcth:shadow_thief ability tree.
#Default true. Every route also needs its own switch and
#the framework switches. A config read failure fails
#closed (abilities = NONE).
shadowAbilitiesEnabled = true
#Sleight-of-hand route: success chance +5%/+10%/+15%,
#global cooldown 200→180/160/140 ticks, high-value
#penalty -10%/-5%/0. Default true. Fail-closed on
#config read errors.
shadowSleightAbilitiesEnabled = true
#Life-siphon route (player targets only): health 1/2/4,
#hunger 2/3/4. Default true. Fail-closed on config read
#errors.
shadowLifeSiphonAbilitiesEnabled = true
#Spell-theft route (player targets only): up to 10/20/30
#seconds of a beneficial effect. Default true. Fail-closed
#on config read errors.
shadowSpellTheftAbilitiesEnabled = true
#Shadow-escape route: on success Speed I 4s / Speed I 6s +
#Invisibility 2s / Speed II 8s + Invisibility 4s; failed-
#roll exposure duration ×0.8/×0.6/×0.4. Default true.
#Fail-closed on config read errors.
shadowEscapeAbilitiesEnabled = true
#Per-pair daily cap on successful shadow thefts that
#grant job experience (default 3). Player targets only,
#keyed by thief + target UUID + UTC date; entity targets
#stay bounded by the LOOTED once-state.
#Range: 1 ~ 10000.
# Default: 3
# Range: 1 ~ 10000
shadowMaxExperienceRewardsPerPairPerDay = 3
