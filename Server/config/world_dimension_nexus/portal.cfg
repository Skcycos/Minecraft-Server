#Portal Configuration
#This file contains the configuration for portals, including teleport delays, cooldowns, and effects.
#
#Portal Types Configuration:
#- Player portals are bound to specific players and can only link to portals from the same creator
#- World portals are bound to the same dimension and can only link within that dimension
#- Unbound portals can link to any other unbound portal across dimensions
#- Event portals are one-way teleports with no return portal (moderator only)
#
#Corner Block Configuration:
#You can change the corner blocks for each portal type to match your server requirements.
#Use minecraft block IDs (e.g., minecraft:diamond_block, minecraft:emerald_block)
#Mon Aug 24 23:25:30 CST 2026
Portal\:AutoLinkAcrossDimensions=true
Portal\:AutoLinkPortals=true
Portal\:ConfusionDuration=100
Portal\:ParticleCount=30
Portal\:ParticleOffsetY=1.0
Portal\:ParticleSpeed=0.1
Portal\:ParticleSpreadXZ=0.5
Portal\:ParticleSpreadY=1.0
Portal\:SoundPitch=1.0
Portal\:SoundVolume=1.0
Portal\:TeleportCooldown=40
Portal\:TeleportDelay=60
PortalBlocks\:EventPortalCornerBlock=minecraft\:beacon
PortalBlocks\:PlayerPortalCornerBlock=minecraft\:diamond_block
PortalBlocks\:UnboundPortalCornerBlock=minecraft\:netherite_block
PortalBlocks\:WorldPortalCornerBlock=minecraft\:emerald_block
PortalLimits\:EventPortalMaxLinks=-1
PortalLimits\:PlayerPortalMaxLinks=2
PortalLimits\:UnboundPortalMaxLinks=2
PortalLimits\:WorldPortalMaxLinks=2
PortalTypes\:EnableEventPortals=true
PortalTypes\:EnablePlayerPortals=true
PortalTypes\:EnableUnboundPortals=true
PortalTypes\:EnableWorldPortals=true
