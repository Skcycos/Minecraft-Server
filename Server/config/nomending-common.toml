#If true, Mending may appear as a rare reward in exploration loot tables (see lootMendingChance).
allowMendingInLoot = false
#Per-applicable-chest chance to inject a Mending book when allowMendingInLoot is true.
# Default: 0.02
# Range: 0.0 ~ 1.0
lootMendingChance = 0.02
#If true, anvil repairs cost 0 XP and do not raise future combine costs.
zeroAnvilCost = true
#If true, anvil repair recipes restore items to full durability instead of the vanilla 25% per unit.
fullRepair = true
#If true, items that can take Mending but have no repair material get Bottle O' Enchanting as a default.
defaultRepairFallback = true
#If true, items at 1 durability are protected from being broken: armor auto-unequips when it reaches 1 durability (if there's room in the inventory), and held tools/weapons cannot be used until repaired.
protectAtOneDurability = false
