# This is an example neoforge.mods.toml file. It contains the data relating to the loading mods.
# There are several mandatory fields (#mandatory), and many more that are optional (#optional).
# The overall format is standard TOML format, v0.5.0.
# Note that there are a couple of TOML lists in this file.
# Find more information on toml format here:  https://github.com/toml-lang/toml

# The name of the mod loader type to load - for regular FML @Mod mods it should be javafml
modLoader="javafml" #mandatory

# A version range to match for said mod loader - for regular FML @Mod it will be the FML version. This is currently 2.
loaderVersion="[1,)" #mandatory

# The license for you mod. This is mandatory metadata and allows for easier comprehension of your redistributive properties.
# Review your options at https://choosealicense.com/. All rights reserved is the default copyright stance, and is thus the default here.
license="MIT"

# A URL to refer people to when problems occur with this mod
#issueTrackerURL="https://change.me.to.your.issue.tracker.example.invalid/" #optional

# A list of mods - how many allowed here is determined by the individual mod loader
[[mods]] #mandatory

# The modid of the mod
modId="tcth" #mandatory

# The version number of the mod
version="0.2.9" #mandatory

# A display name for the mod
displayName="TCTH Integration" #mandatory

# A URL to query for updates for this mod. See the JSON update specification https://docs.neoforged.net/docs/misc/updatechecker/
#updateJSONURL="https://change.me.example.invalid/updates.json" #optional

# A URL for the "homepage" for this mod, displayed in the mod UI
#displayURL="https://change.me.to.your.mods.homepage.example.invalid/" #optional

# A file name (in the root of the mod JAR) containing a logo for display
#logoFile="examplemod.png" #optional

# A text field displayed in the mod UI
#credits="" #optional

# The authors of the mod, displayed in the mod UI (optional)
authors="Tanrunn"

# The description text for the mod (multi line!) (#mandatory)
description='''
A configurable NeoForge integration framework that connects cooking,
professions, bounties, orders, and economy systems across supported mods.
'''

# The [[mixins]] block allows you to declare your mixin config to FML so that it gets loaded.
[[mixins]]
config="tcth.mixins.json"

# Conditional compat mixins: each config is only registered (and thus only
# applied) when the listed mods are installed. When the target mod is absent
# the config is skipped entirely and the mixin classes are never resolved.
[[mixins]]
config="farmersdelight_compat.mixins.json"
requiredMods=["farmersdelight"]

[[mixins]]
config="kaleidoscope_cookery_compat.mixins.json"
requiredMods=["kaleidoscope_cookery"]

# Neapolitan farming right-click harvest (strawberry bush + mint). Gated so
# StrawberryBushBlock / MintBlock are never resolved without Neapolitan.
[[mixins]]
config="neapolitan_farming_compat.mixins.json"
requiredMods=["neapolitan"]

# My Nether's Delight powdery cane / powdery cannon special-case harvest.
# Gated so PowderyCaneBlock / PowderyCannonBlock are never resolved without MND.
[[mixins]]
config="mynethersdelight_farming_compat.mixins.json"
requiredMods=["mynethersdelight"]

# Dungeon's Delight monster pot take-out (phase 6B). Gated so MonsterPot*
# classes are never resolved without the optional mod.
[[mixins]]
config="dungeonsdelight_compat.mixins.json"
requiredMods=["dungeonsdelight"]

# Brewin' and Chewin' Keg pouring detection (phase 7B). Gated so KegBlock*
# classes are never resolved without the optional mod.
[[mixins]]
config="brewinandchewin_compat.mixins.json"
requiredMods=["brewinandchewin"]

# Kaleidoscope Tavern Shaker + Barrel beverage-preparation detection (phase 7F).
# Gated so the optional mod's classes are never resolved without the mod.
[[mixins]]
config="kaleidoscope_tavern_compat.mixins.json"
requiredMods=["kaleidoscope_tavern"]

# Farmer tilling-route durability mixin (phase 4B/4C). Injects the real
# ItemStack.hurtAndBreak(ServerLevel, LivingEntity, Consumer) overload that
# NeoForge 21.1 uses (Arc's on_hurt_item targets the unused ServerPlayer
# wrapper). Requires Jobs+ for the powerup tier query; skipped entirely when
# Jobs+ is absent so the mixin class is never resolved.
[[mixins]]
config="tcth_farmer_abilities.mixins.json"
requiredMods=["jobsplus"]

# Scorched Guns Niami arrow birth-registration mixin (phase 5A.1). Only applied
# when Scorched Guns is installed; never falls back to a heuristic.
[[mixins]]
config="scguns_compat.mixins.json"
requiredMods=["scguns"]

# Scorched Guns ammo-saver mixin (phase 5B/5B.1): ordinary-shot deduction
# (handleShoot Math.max redirect) + beam consumption period (consumeAmmo HEAD).
# Requires BOTH Scorched Guns (the target class) and Jobs+ (the powerup query);
# skipped entirely when either is absent so the mixin classes are never resolved.
[[mixins]]
config="scguns_ammo_compat.mixins.json"
requiredMods=["scguns", "jobsplus"]

# The [[accessTransformers]] block allows you to declare where your AT file is.
# If this block is omitted, a fallback attempt will be made to load an AT from META-INF/accesstransformer.cfg
#[[accessTransformers]]
#file="META-INF/accesstransformer.cfg"

# The coremods config file path is not configurable and is always loaded from META-INF/coremods.json

# A dependency - use the . to indicate dependency for a specific modid. Dependencies are optional.
[[dependencies.tcth]] #optional
    # the modid of the dependency
    modId="neoforge" #mandatory
    # The type of the dependency. Can be one of "required", "optional", "incompatible" or "discouraged" (case insensitive).
    # 'required' requires the mod to exist, 'optional' does not
    # 'incompatible' will prevent the game from loading when the mod exists, and 'discouraged' will show a warning
    type="required" #mandatory
    # Optional field describing why the dependency is required or why it is incompatible
    # reason="..."
    # The version range of the dependency
    versionRange="[21.1.247,)" #mandatory
    # An ordering relationship for the dependency.
    # BEFORE - This mod is loaded BEFORE the dependency
    # AFTER - This mod is loaded AFTER the dependency
    ordering="NONE"
    # Side this dependency is applied on - BOTH, CLIENT, or SERVER
    side="BOTH"

# Here's another dependency
[[dependencies.tcth]]
    modId="minecraft"
    type="required"
    # This version range declares a minimum of the current minecraft version up to but not including the next major version
    versionRange="[1.21.1]"
    ordering="NONE"
    side="BOTH"

# Jobs+ dish-reward module (optional; loaded only when the mod is installed).
[[dependencies.tcth]]
    modId="jobsplus"
    type="optional"
    versionRange="[9.0.0,)"
    ordering="NONE"
    side="BOTH"

# Arc is the mandatory dependency of Jobs+ and is required for the dish action
# bridge; TCTH declares it optional because TCTH itself runs without it.
[[dependencies.tcth]]
    modId="arc"
    type="optional"
    versionRange="[9.0.0,)"
    ordering="NONE"
    side="BOTH"

# Field Guide cookbook unlock module (optional; loaded only when installed).
[[dependencies.tcth]]
    modId="fieldguide"
    type="optional"
    versionRange="[1.13.4,)"
    ordering="NONE"
    side="BOTH"

# Scorched Guns firearm-kill detection for the tcth:gunner profession (optional;
# loaded only when installed via the conditional CompatLoader descriptor).
# GD656 Kill Icon is deliberately NOT declared: the gunner pipeline is fully
# independent of it (TCTH never reads/writes GD656 data).
[[dependencies.tcth]]
    modId="scguns"
    type="optional"
    versionRange="[1.5,)"
    ordering="NONE"
    side="BOTH"

# Neapolitan crop harvest (optional; mixins gated by requiredMods).
# Upper bound excludes unvalidated 6.1.x (server JAR is exactly 6.0.1).
[[dependencies.tcth]]
    modId="neapolitan"
    type="optional"
    versionRange="[6.0.1,6.1.0)"
    ordering="NONE"
    side="BOTH"

# Dungeons Delight crop harvest via block tags only (optional; no Java mixins).
# Upper bound excludes unvalidated 1.6.x (server JAR is exactly 1.5.0).
[[dependencies.tcth]]
    modId="dungeonsdelight"
    type="optional"
    versionRange="[1.5.0,1.6.0)"
    ordering="NONE"
    side="BOTH"

# My Nether's Delight powdery / colony harvest (optional; mixins gated by requiredMods).
# Upper bound excludes unvalidated 1.11.x (server JAR is exactly 1.10.4).
[[dependencies.tcth]]
    modId="mynethersdelight"
    type="optional"
    versionRange="[1.10.4,1.11.0)"
    ordering="NONE"
    side="BOTH"

# Features are specific properties of the game environment, that you may want to declare you require. This example declares
# that your mod requires GL version 3.2 or higher. Other features will be added. They are side aware so declaring this won't
# stop your mod loading on the server for example.
#[features.tcth]
#openGLVersion="[3.2,)"
