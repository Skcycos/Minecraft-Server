name: Build

on: [push, pull_request]

# Template for the future standalone TCTH repository.
#
# NOTE: this workflow lives in a subdirectory of the Minecraft-Server repo
# (mod develop/tcthintegration-template-1.21.1/.github/workflows/build.yml).
# GitHub only executes workflows at the repository root (.github/workflows of
# the default branch), so this nested workflow is NOT executed by the current
# Minecraft-Server repository. It is a template to be used when TCTH is
# published as its own repository.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # Optional-mod dev jars used as compileOnly/testOnly by the build.
      # Pinned Modrinth CDN URLs (no "latest"); every download is verified
      # against the SHA-256 of the exact JAR installed on the test server.
      # Phase 4A.4.1: added neapolitan / dungeonsdelight / mynethersdelight /
      # scguns (previously compileOnly in build.gradle but missing here).
      - name: Download and verify optional-mod dev jars
        run: |
          set -euo pipefail
          mkdir -p dev-mods

          curl -fL -o dev-mods/farmersdelight-1.3.2.jar "https://cdn.modrinth.com/data/R2OftAxM/versions/GbNuOZ4S/FarmersDelight-1.21.1-1.3.2.jar"
          echo "8ff438d62e1fce61542945faae45975d823e04bd6e73a07a121ea05ce2f03de7  dev-mods/farmersdelight-1.3.2.jar" | sha256sum -c -

          curl -fL -o dev-mods/kaleidoscopecookery-1.4.1.jar "https://cdn.modrinth.com/data/v17FatAc/versions/TqaHu4Ma/kaleidoscopecookery-1.4.1-neoforge%2Bmc1.21.1.jar"
          echo "04dd114f975df57fb8bb3f09e8c96d6de18587838ab5a019271b51a2aec24f74  dev-mods/kaleidoscopecookery-1.4.1.jar" | sha256sum -c -

          curl -fL -o dev-mods/arc-9.0.0.jar "https://cdn.modrinth.com/data/H3eKhxi7/versions/gTreBhs6/arc-9.0.0-neoforge.jar"
          echo "bd165916f75a9c7c5d8ccd9aaf8ca4a151eaffa68280a562da7084428343cd50  dev-mods/arc-9.0.0.jar" | sha256sum -c -

          curl -fL -o dev-mods/jobsplus-9.0.0.jar "https://cdn.modrinth.com/data/hxGLlCnq/versions/6PuTdm1X/jobsplus-9.0.0-neoforge.jar"
          echo "5f06f40317ea727afd79ddd02790d6b840702999115d439fb09e8c6c77e5b5be  dev-mods/jobsplus-9.0.0.jar" | sha256sum -c -

          curl -fL -o dev-mods/fieldguide-1.13.4.jar "https://cdn.modrinth.com/data/72RRCWM6/versions/6EZPXuN5/fieldguide-neoforge-1.21.1-1.13.4.jar"
          echo "a5ca90728ac3c210b6a27b4451c1ab75df62650da32545d034073ead04e4a531  dev-mods/fieldguide-1.13.4.jar" | sha256sum -c -

          # Scorched Guns 1.5 (server: ScorchedGuns-Neoforge-1.5.jar)
          curl -fL -o dev-mods/scguns-1.5.jar "https://cdn.modrinth.com/data/GwtIopV4/versions/8pMPZhvI/ScorchedGuns-1.5.jar"
          echo "6a4237c518fa36a56d3bf2a269fad508e2f4053a51e9c43381709b09806c2001  dev-mods/scguns-1.5.jar" | sha256sum -c -

          # Phase 4A.4 farming crop compat (exact server JAR versions)
          curl -fL -o dev-mods/neapolitan-6.0.1.jar "https://cdn.modrinth.com/data/InYMuiQt/versions/RQ5qgaUC/neapolitan-1.21.1-6.0.1.jar"
          echo "82e104afc49887134fb0f74e6b3d3bc827fe1f88ea3d14836c2701218a1071d9  dev-mods/neapolitan-6.0.1.jar" | sha256sum -c -

          curl -fL -o dev-mods/dungeonsdelight-1.5.0.jar "https://cdn.modrinth.com/data/qPfNr476/versions/aFluEQDH/neoforge-dungeonsdelight-1.21.1-1.5.0.jar"
          echo "90342848adb6b98569a53a1d34fabbd7042f80ee530b23b7e378e329c5a1c5cd  dev-mods/dungeonsdelight-1.5.0.jar" | sha256sum -c -

          curl -fL -o dev-mods/mynethersdelight-1.10.4.jar "https://cdn.modrinth.com/data/O53VhQoZ/versions/OdH19ieD/MyNethersDelight-1.21.1-1.10.4.jar"
          echo "fe246d086dcb87c7d2163fbbff09fd7e164f206238e52700fe0b3e34fb343432  dev-mods/mynethersdelight-1.10.4.jar" | sha256sum -c -

      - name: Build with Gradle
        run: ./gradlew clean build --no-daemon
