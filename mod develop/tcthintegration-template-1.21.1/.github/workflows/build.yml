name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # Optional-mod dev jars used as compileOnly/testOnly by the build.
      # Pinned to the exact versions installed on the test server; fetched from
      # the Modrinth CDN (no public Maven exists). Never committed, never
      # bundled into the released TCTH JAR.
      - name: Fetch optional mod dev jars (compileOnly)
        run: |
          mkdir -p dev-mods
          curl -fL -o dev-mods/farmersdelight-1.3.2.jar "https://cdn.modrinth.com/data/R2OftAxM/versions/GbNuOZ4S/FarmersDelight-1.21.1-1.3.2.jar"
          curl -fL -o dev-mods/kaleidoscopecookery-1.4.1.jar "https://cdn.modrinth.com/data/v17FatAc/versions/TqaHu4Ma/kaleidoscopecookery-1.4.1-neoforge%2Bmc1.21.1.jar"

      - name: Build with Gradle
        run: ./gradlew build